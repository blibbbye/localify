name: Build Localify Discord Connector

permissions:
  contents: write

on:
  push:
    paths:
      - "desktop_player/**"
      - ".github/workflows/build-desktop-player.yml"
  workflow_dispatch:
  pull_request:
    paths:
      - "desktop_player/**"
      - ".github/workflows/build-desktop-player.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build connector
        shell: pwsh
        run: |
          msbuild "desktop_player/LocalifyConnector.csproj" /m /p:Configuration=Release /p:Platform=AnyCPU
          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed with exit code $LASTEXITCODE"
          }
          $built = "desktop_player/bin/Release/Localify Discord Connector.exe"
          if (!(Test-Path $built)) {
            throw "Build output not found: $built"
          }
          Copy-Item $built "Localify Discord Connector.exe" -Force

      - name: Publish EXE to repository
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "Localify Discord Connector.exe"
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Publish Localify Discord Connector.exe"
            git push
          }

      - name: Verify size
        shell: pwsh
        run: |
          $f = Get-Item "Localify Discord Connector.exe"
          Write-Host "EXE size: $($f.Length) bytes"
          if ($f.Length -ge 7000000) {
            throw "EXE is too large: $($f.Length) bytes"
          }

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Localify-Discord-Connector
          path: Localify Discord Connector.exe
          if-no-files-found: error
