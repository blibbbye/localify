name: Validate Localify JavaScript

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract and check inline scripts
        run: |
          python - <<'PY'
          import pathlib, re, subprocess, tempfile
          html = pathlib.Path("index.html").read_text(encoding="utf-8")
          blocks = re.findall(r"<script\\b[^>]*>([\\s\\S]*?)</script\\s*>", html, flags=re.I)
          if not blocks:
              raise SystemExit("No inline script blocks found")
          checked = 0
          for index, source in enumerate(blocks):
              if not source.strip():
                  continue
              with tempfile.NamedTemporaryFile("w", suffix=".js", encoding="utf-8", delete=False) as file:
                  file.write(source)
                  path = file.name
              subprocess.run(["node", "--check", path], check=True)
              checked += 1
          print(f"Checked {checked} inline JavaScript block(s)")
          PY
