  <style>
    :root{
      --bg:#090b0e; --panel:#111419; --panel2:#171a20; --panel3:#20242c;
      --text:#f7f7f8; --muted:#9ca3af; --line:#282d36; --accent:#d1d5db;
      --accent2:#f3f4f6; --danger:#ff5b6e; --shadow:0 18px 60px rgba(0,0,0,.35);
      --radius:18px;
    }
    *{box-sizing:border-box;scrollbar-width:none;-ms-overflow-style:none}
    *::-webkit-scrollbar{width:0;height:0;display:none}
    html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    html{width:100%;overflow-x:hidden}
    body{overflow:hidden;width:100%;max-width:100vw;overscroll-behavior-x:none}
    button,input,textarea,select{font:inherit}
    button{border:0;color:inherit;cursor:pointer}
    .app{height:100dvh;min-height:100%;width:100%;max-width:100vw;overflow:hidden;display:grid;grid-template-columns:clamp(190px,20vw,250px) minmax(0,1fr);grid-template-rows:1fr 92px}.app.nowPanelOpen{grid-template-columns:clamp(170px,16vw,220px) minmax(0,1fr) minmax(260px,320px)}
    aside{grid-row:1/2;background:#0c0f13;border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;min-width:0}
    .brand{display:flex;align-items:center;gap:11px;padding:6px 10px 22px;font-weight:900;font-size:23px;letter-spacing:-.8px}
    .logo{width:34px;height:34px;border-radius:11px;background:var(--accent);display:grid;place-items:center;overflow:hidden;box-shadow:0 8px 28px var(--theme-shadow,rgba(125,211,252,.24))}
    .logo img{width:100%;height:100%;display:block;object-fit:cover}
    .nav{display:grid;gap:5px}
    .nav button,.sideAction{background:transparent;padding:11px 12px;border-radius:11px;text-align:left;color:#c5cad2;font-weight:700;display:flex;align-items:center;gap:11px}
    .nav button:hover,.sideAction:hover{background:#171b21;color:#fff}
    .nav button.active{background:rgba(125,211,252,.10);color:var(--accent)}
    .icon{width:20px;height:20px;display:grid;place-items:center;opacity:.9}
    .sectionTitle{padding:10px 12px 7px;color:#7d8591;font-size:11px;letter-spacing:.11em;text-transform:uppercase;font-weight:900}
    .sideBottom{margin-top:8px;display:grid;gap:7px}
    main{grid-row:1/2;min-width:0;overflow:auto;background:
      radial-gradient(900px 500px at 85% -10%,rgba(125,211,252,.08),transparent 60%),
      linear-gradient(180deg,#0b0e12 0%,#0a0c0f 34%,#090b0e 100%)}
    .topbar{position:sticky;top:0;z-index:8;display:flex;align-items:center;gap:12px;padding:15px 24px;background:rgba(9,11,14,.82);backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,.04)}
    .search{flex:1;max-width:720px;position:relative}
    .search input{width:100%;background:#15181e;border:1px solid #252a33;color:#fff;border-radius:14px;padding:12px 16px 12px 42px;outline:none}
    .search input:focus{border-color:#464d59;box-shadow:0 0 0 4px rgba(125,211,252,.06)}
    .searchIcon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#7e8794}
    .topSpacer{flex:1}
    .pill{padding:9px 12px;border-radius:999px;background:#15181e;color:#aeb6c1;border:1px solid #272c35;font-weight:800}
    .discordStatus{display:inline-flex;align-items:center;gap:7px;padding:8px 11px;border-radius:999px;background:#15181e;color:#aeb6c1;border:1px solid #272c35;font-size:11px;font-weight:900;white-space:nowrap;cursor:pointer;user-select:none}
    .discordDot{width:8px;height:8px;border-radius:50%;background:#6b7280;box-shadow:0 0 0 3px rgba(107,114,128,.12)}
    .discordStatus.connected{color:#d9ffe5;border-color:rgba(74,222,128,.28);background:rgba(34,197,94,.08)}
    .discordStatus.connected .discordDot{background:#4ade80;box-shadow:0 0 0 3px rgba(74,222,128,.12)}
    .discordStatus.disabled .discordDot{background:#6b7280}
    .discordStatus.searching .discordDot{background:#fbbf24;box-shadow:0 0 0 3px rgba(251,191,36,.12)}
    .discordStatus.error{color:#ffc4cb;border-color:rgba(255,91,110,.28);background:rgba(255,91,110,.08)}
    .discordStatus.error .discordDot{background:#fb7185;box-shadow:0 0 0 3px rgba(251,113,133,.12)}
    .discordStatus{display:none!important}
    .discordTopBtn{width:42px;height:42px;padding:0;border-radius:13px;display:grid;place-items:center;background:#15181e;border:1px solid #272c35;color:#cbd2dc;flex:none;position:relative}
    .discordTopBtn:hover{background:#1c2128;color:#fff;border-color:#39414c}
    .discordTopBtn.connected{color:#d9ffe5;border-color:rgba(74,222,128,.34);background:rgba(34,197,94,.09)}
    .discordTopBtn.error{color:#ffc4cb;border-color:rgba(255,91,110,.34);background:rgba(255,91,110,.08)}
    .discordTopBtn.searching{color:#fff1bd;border-color:rgba(251,191,36,.34);background:rgba(251,191,36,.08)}
    .discordTopBtn.disabled{color:#aeb6c1}
    .discordGlyph{font-size:18px;font-weight:1000;line-height:1}
    .discordTopDot{position:absolute;right:5px;bottom:5px;width:7px;height:7px;border-radius:50%;background:#6b7280;box-shadow:0 0 0 2px #15181e}
    .discordTopBtn.connected .discordTopDot{background:#4ade80}.discordTopBtn.error .discordTopDot{background:#fb7185}.discordTopBtn.searching .discordTopDot{background:#fbbf24}
    .discordPanel{display:grid;gap:12px}
    .discordConnectCard{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1px solid #2a313a;background:#0e1217;border-radius:15px}
    .discordConnectIcon{width:42px;height:42px;border-radius:12px;background:#171c23;display:grid;place-items:center;font-size:20px;flex:none}
    .discordConnectTitle{font-weight:900}.discordConnectSub{color:#7d8793;font-size:11px;line-height:1.4;margin-top:2px}
    .discordStep{display:grid;grid-template-columns:28px 1fr;gap:9px;align-items:start;padding:10px 0;border-top:1px solid #242a31}
    .discordStep:first-child{border-top:0}.discordStepNum{width:24px;height:24px;border-radius:50%;background:#171c22;border:1px solid #2b333d;display:grid;place-items:center;font-size:11px;font-weight:1000;color:#cbd3dd}.discordStep strong{font-size:13px}.discordStep p{margin:3px 0 0;color:#7f8894;font-size:11px;line-height:1.5}
    .discordActions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.discordActions a,.discordActions button{min-height:42px;display:flex;align-items:center;justify-content:center;text-decoration:none}
    @media(max-width:700px){.discordTopBtn{width:40px;height:40px;border-radius:12px}.discordActions{grid-template-columns:1fr}.discordPanel{gap:10px}}

    .content{padding:28px 28px 140px}
    .hero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(260px,.65fr);gap:18px;align-items:stretch;margin-bottom:28px}
    .heroCard,.quickCard{border:1px solid rgba(255,255,255,.06);background:linear-gradient(145deg,#171b20,#101318);border-radius:24px;box-shadow:var(--shadow)}
    .heroCard{padding:28px;min-height:260px;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden}
    .heroCard:after{content:"";position:absolute;inset:auto -80px -110px auto;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,rgba(125,211,252,.2),transparent 65%)}
    .heroKicker{font-size:12px;color:var(--accent);font-weight:1000;letter-spacing:.13em;text-transform:uppercase}
    h1{font-size:clamp(34px,5vw,66px);line-height:.97;letter-spacing:-2.6px;margin:9px 0 12px;max-width:760px}
    .heroDesc{color:#a7adb8;max-width:650px;line-height:1.5}
    .heroActions{display:flex;gap:9px;margin-top:18px;flex-wrap:wrap}
    .primary,.secondary,.dangerBtn{border-radius:12px;padding:11px 16px;font-weight:900}
    .primary{background:var(--accent);color:#0b0e08}
    .primary:hover{background:var(--accent2)}
    .secondary{background:#1a1e24;border:1px solid #2b3039;color:#f0f1f2}
    .dangerBtn{background:rgba(255,91,110,.1);border:1px solid rgba(255,91,110,.3);color:#ffb4bd}
    .deleteLibraryBtn{background:rgba(255,73,94,.08);border:1px solid rgba(255,91,110,.32);color:#ff8f9d}
    .deleteLibraryBtn:hover{background:rgba(255,73,94,.16);border-color:rgba(255,91,110,.5);color:#ffb5bf}
    .deleteWarning{display:grid;gap:14px}
    .deleteWarningBox{padding:14px 15px;border:1px solid rgba(255,91,110,.28);background:rgba(255,91,110,.07);border-radius:14px;color:#ffc0c7;line-height:1.5}
    .deleteWarningBox strong{color:#fff}
    .quickCard{padding:20px;display:flex;flex-direction:column;justify-content:space-between}
    .quickTitle{font-weight:900;font-size:17px}
    .quickStat{font-size:44px;font-weight:1000;letter-spacing:-1.8px;margin:10px 0 3px}
    .muted{color:var(--muted)}
    .dropzone{border:1px dashed #3b424c;border-radius:16px;padding:16px;text-align:center;color:#9ea6b2;margin-top:14px}
    .dropzone.drag{border-color:var(--accent);background:rgba(125,211,252,.05);color:#e0f6ff}
    .dropzone .mobileFileButton{display:none}
    @media (max-width:700px){
      body{padding-bottom:env(safe-area-inset-bottom)}
      .topbar{padding-top:calc(10px + env(safe-area-inset-top));padding-left:10px;padding-right:10px;min-width:0}
      .topbar .mobileTools{display:inline-flex;flex:none}
      .topbar .mobileImportBtn{display:inline-flex;flex:none}
      .player{left:0;right:0;bottom:0;width:100%;max-width:100vw;padding-bottom:calc(8px + env(safe-area-inset-bottom))}
      .content{width:100%;max-width:100vw;overflow-x:hidden}
      .hero,.grid,.viewGrid{max-width:100%;overflow:hidden}
      .tableWrap{width:100%;max-width:100%;overflow-x:hidden}
      table{width:100%;table-layout:fixed}
      thead th:nth-child(3),tbody td:nth-child(3),thead th:nth-child(5),tbody td:nth-child(5){display:none}
      .actionsHead{width:50px}
      .profileHero{min-width:0}
      .entityActions{max-width:100%;overflow:hidden}
      .rowActions .more-row{display:none}
      .dropzone .mobileFileButton{display:inline-flex;align-items:center;justify-content:center;width:100%;margin-top:10px}
      .dropzone{padding:14px}
      .heroActions .secondary{display:none}
    }
    .section{margin-top:28px}
    .sectionHead{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:11px}
    .sectionHeadActions{display:flex;align-items:center;justify-content:flex-end;gap:10px;flex:none;min-width:fit-content}.sectionHeadActions .albumCount{margin:0!important;min-width:36px;height:36px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;flex:none;border:1px solid #29303a;border-radius:999px;background:#11161b;color:#aeb7c2;font-size:12px;font-weight:950;line-height:1;white-space:nowrap}.sectionHeadActions .iconOnlyCreate{margin:0!important;flex:none;width:42px;height:42px}
    .sectionHead h2{margin:0;font-size:20px;letter-spacing:-.4px}
    .sectionHead span{color:#737c89;font-size:12px;font-weight:800}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:15px}
    .card{position:relative;background:#111419;border:1px solid #20242b;border-radius:17px;padding:12px;transition:transform .15s ease,border-color .15s ease,background .15s ease}
    .card:hover{transform:translateY(-2px);border-color:#333943;background:#15181e}
    .album-open:hover{z-index:20}
    .albumHoverInfo{display:none;position:absolute;left:12px;right:12px;top:calc(100% + 7px);padding:11px 12px;border:1px solid #313946;border-radius:12px;background:rgba(18,22,28,.98);box-shadow:0 18px 42px rgba(0,0,0,.45);z-index:30;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
    .album-open:hover .albumHoverInfo{display:grid}
    .albumHoverItem{min-width:0}
    .albumHoverItem strong{display:block;color:#707b88;font-size:9px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px}
    .albumHoverItem span{display:block;color:#e2e7ec;font-size:11px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .tableSort{appearance:none;background:transparent;border:0;padding:0;margin:0;color:inherit;text-transform:inherit;font:inherit;letter-spacing:inherit;font-weight:inherit;cursor:pointer;display:inline-flex;align-items:center;justify-content:flex-start;gap:5px;line-height:1;min-height:18px;white-space:nowrap;vertical-align:middle}
    .tableSort:hover{color:#fff}
    .tableSort.active{color:var(--accent)}
    .tableSortArrow{display:inline-flex;align-items:center;justify-content:center;width:10px;height:14px;line-height:14px;font-size:12px;font-weight:1000;opacity:1;flex:none;overflow:visible}
    .art{aspect-ratio:1/1;border-radius:13px;overflow:hidden;background:#20242b;position:relative}
    .art img{width:100%;height:100%;object-fit:cover;display:block}
    .art .fallback{width:100%;height:100%;display:grid;place-items:center;font-size:44px;color:#58616f;background:
      radial-gradient(circle at 30% 30%,#343c47,transparent 45%),
      radial-gradient(circle at 75% 70%,#1b222c,transparent 48%),#20242a}
    .playOverlay{position:absolute;right:9px;height:45px;border-radius:50%;background:var(--accent);color:#10140c;display:grid;place-items:center;opacity:0;transform:translateY(4px);transition:.16s;font-size:17px;font-weight:1000;box-shadow:0 10px 24px rgba(0,0,0,.35)}
    .card:hover .playOverlay{opacity:1;transform:translateY(0)}
    .cardTitle{font-weight:900;margin:10px 2px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .cardSub{font-size:12px;color:#7e8794;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .tableWrap{background:#0f1216;border:1px solid #20242b;border-radius:17px;overflow:auto;max-width:100%}
    .selectionBar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;background:#151a20;border:1px solid #2a313a;border-radius:14px;margin:12px 0}.selectionBar strong{margin-right:4px}.bulkFieldToggle{display:inline-flex;align-items:center;gap:9px;padding:8px 10px;border:1px solid #2a313a;background:#11161b;border-radius:10px;color:#dce1e7;font-size:12px;font-weight:850;cursor:pointer;user-select:none}.bulkFieldToggle input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}.bulkFieldToggle{font-size:12px!important;text-transform:none!important;letter-spacing:0!important;color:#dce1e7!important}.bulkFieldToggle input:checked + .bulkToggleDot{background:var(--accent);border-color:var(--accent);color:#081017}.bulkToggleDot{width:18px;height:18px;border-radius:6px;border:1px solid #45505d;background:#0c0f13;display:grid;place-items:center;flex:none}.bulkToggleDot .svgIcon{width:12px;height:12px;display:none}.bulkFieldToggle input:checked + .bulkToggleDot .svgIcon{display:block}
    .checkCell{width:34px;text-align:center}
    .actionsHead{width:74px;text-align:right!important}
    .rowPlay{width:38px;height:38px;border-radius:11px;background:var(--accent);color:#071018;display:grid;place-items:center;font-weight:1000;box-shadow:0 8px 22px rgba(125,211,252,.16);transition:.16s}.rowPlay:hover{background:var(--accent2);transform:translateY(-1px)}.track-row.isPlaying{background:rgba(125,211,252,.055)}.track-row.isPlaying td{color:#f6fbff}.track-row.isPlaying .miniTitle{color:var(--accent)}.rowPlay.isPlaying{background:#fff;color:#0a0c10;box-shadow:0 8px 24px rgba(255,255,255,.14)}
    .infoBtn{width:34px;height:34px;border-radius:50%;padding:0;display:grid;place-items:center;font-weight:1000}
    .collectionArt.likedArt{background:linear-gradient(145deg,#14334a,#0d1e2b 58%,#112a3a);color:#7dd3fc}
    .trackCheck{width:18px;height:18px;accent-color:var(--accent);cursor:pointer}
    .shuffleToggle{display:inline-flex;align-items:center;gap:7px;color:#aeb6c1;font-size:12px;font-weight:900;white-space:nowrap}.shuffleToggle input{width:18px;height:18px;accent-color:var(--accent);margin:0}
    .eqSlider{width:100%}
    .mobileTools{display:none}
    .lyricsEditor{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;line-height:1.65;white-space:pre;tab-size:2;min-height:260px}
    .lyricsHint{font-size:11px;color:#77818e;margin-top:6px}
    .creditPeople{min-height:74px}
    .mobileImportBtn{display:none}
    .sortBtn{cursor:pointer;user-select:none}
    .sortBtn.active{color:var(--accent)}
    .presetHome{display:grid;gap:18px}
    .presetHero{padding:20px;border:1px solid #2b333d;border-radius:18px;background:radial-gradient(500px 180px at 15% 0%,rgba(125,211,252,.14),transparent 65%),linear-gradient(145deg,#171d24,#101419)}
    .presetHeroTop{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
    .presetHeroIcon{width:52px;height:52px;border-radius:15px;background:rgba(125,211,252,.12);border:1px solid rgba(125,211,252,.25);display:grid;place-items:center;color:var(--accent);flex:none}
    .presetHeroIcon .svgIcon{width:25px;height:25px}
    .presetHero h3{margin:0;font-size:22px;letter-spacing:-.5px}
    .presetHero p{margin:6px 0 0;color:#87919d;font-size:12px;line-height:1.5;max-width:650px}
    .presetActionGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .presetAction{display:flex;align-items:center;gap:13px;text-align:left;padding:15px;border:1px solid #29313b;border-radius:14px;background:#151a20;transition:.15s}
    .presetAction:hover{background:#1a2027;border-color:#3b4653;transform:translateY(-1px)}
    .presetActionIcon{width:40px;height:40px;border-radius:12px;background:#0f1419;border:1px solid #2b343f;display:grid;place-items:center;color:#cbd4de;flex:none}
    .presetActionIcon .svgIcon{width:19px;height:19px}
    .presetAction strong{display:block;font-size:13px}
    .presetAction span{display:block;margin-top:3px;color:#7f8996;font-size:11px;line-height:1.35}
    .presetQuickTitle{font-size:10px;color:#727d89;text-transform:uppercase;letter-spacing:.1em;font-weight:950}
    .presetQuickGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
    .presetQuick{padding:11px 12px;border:1px solid #252d37;border-radius:11px;background:#11161b;text-align:left}
    .presetQuick:hover{background:#171d23}
    .presetQuick strong{font-size:12px}
    .presetQuick span{display:block;color:#737e8b;font-size:10px;margin-top:3px}
    @media(max-width:700px){.presetActionGrid{grid-template-columns:1fr}.presetQuickGrid{grid-template-columns:1fr 1fr}}
    .profileHero{display:grid;grid-template-columns:175px 1fr;gap:20px;align-items:end;margin-bottom:18px}
    .profileArt{width:175px;height:175px;border-radius:22px;overflow:hidden;background:#20242a;position:relative;flex:none}
    .profileArt img{width:100%;height:100%;object-fit:cover}
    .profileArt.artist{border-radius:50%}
    .collectionArt{width:175px;height:175px;border-radius:22px;display:grid;place-items:center;font-size:70px;font-weight:1000;color:#eaf8ff;background:radial-gradient(circle at 30% 25%,#17435b,transparent 40%),linear-gradient(135deg,#0e2430,#08151c 55%,#123649);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 18px 60px rgba(0,0,0,.35)}
    .nowFallback{width:100%;height:100%;display:grid;place-items:center;font-weight:1000;font-size:20px;letter-spacing:-1px;background:linear-gradient(145deg,#0b2838,#0d1820 60%,#102a3a);color:#7dd3fc}.artistFallback .svgIcon{width:34%;height:34%;stroke:currentColor;fill:none;stroke-width:1.7}
    .metaLine{display:flex;gap:7px;flex-wrap:wrap;color:#8e97a4;font-size:12px;margin-top:7px}
    .metaPill{padding:5px 8px;border:1px solid #29303a;border-radius:999px;background:#151a20}
    .creditsBox{background:#101419;border:1px solid #252b33;border-radius:15px;padding:14px;display:grid;gap:7px;margin-top:13px}
    .creditsGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}

  function openDB(){
    if(db)return Promise.resolve(db);
    if(dbPromise)return dbPromise;
    dbPromise=new Promise((resolve,reject)=>{
      try{
        if(!window.indexedDB) throw new Error("IndexedDB unavailable");
        const req=indexedDB.open(DB_NAME,1);
        req.onupgradeneeded=()=>{
          const d=req.result;
          if(!d.objectStoreNames.contains("meta")) d.createObjectStore("meta");
          if(!d.objectStoreNames.contains("blobs")) d.createObjectStore("blobs");
        };
        req.onblocked=()=>console.warn("Localify database upgrade is blocked");
        req.onsuccess=()=>{
          db=req.result;
          storageReady=true;
          storageBlocked=false;
          db.onversionchange=()=>db.close();
          db.onclose=()=>{db=null};
          resolve(db);
        };
        req.onerror=()=>{storageBlocked=true;reject(req.error||new Error("IndexedDB could not open"))};
      }catch(e){storageBlocked=true;reject(e)}
    }).finally(()=>{dbPromise=null});
    return dbPromise;
  }

  function managedUniqueName(name,id,used){

    let out=base+" ("+suffix+")",n=2;

  async function syncManagedLibrary(opts={}){
    const root=managedRoot();if(!root||managedSyncBusy)return false;managedSyncBusy=true;
    try{
      if(!(await managedPermission(root,false)))return false;
      const albumsDir=await fsDir(root,"Albums"),songsDir=await fsDir(root,"Songs"),artistsDir=await fsDir(root,"Artists"),playlistsDir=await fsDir(root,"Playlists"),foldersDir=await fsDir(root,"Folders");
      const usedAlbums=new Set();
      for(const a of state.albums){
        const folderName=a.managedFolderName||managedUniqueName(a.title,a.id,usedAlbums);usedAlbums.add(String(folderName).toLowerCase());a.managedFolderName=folderName;
        const dir=await fsDir(albumsDir,folderName);
        await fsWriteText(dir,"info.txt",JSON.stringify(managedInfo("album",a),null,2));
        for(const t of state.tracks.filter(t=>t.albumId===a.id)){
          if(!opts.forceAudio&&!t._diskDirty)continue;
          const blob=await ensureTrackBlob(t);if(!isBlobLike(blob))continue;
          const filename=safeFsName(t.fileName||((trackNo(t)!=null?String(trackNo(t)).padStart(2,"0")+". ":"")+displayTrackTitle(t,true)||"Song"))||"song";
          await fsWriteBlob(dir,filename,blob);t.managedPath="Albums/"+folderName+"/"+filename;t._diskDirty=false;
        }
      }
      for(const t of state.tracks.filter(t=>!t.albumId)){
        if(!opts.forceAudio&&!t._diskDirty)continue;
        const blob=await ensureTrackBlob(t);if(!isBlobLike(blob))continue;
        const filename=safeFsName(t.fileName||displayTrackTitle(t,true)||"Song")||"song";
        await fsWriteBlob(songsDir,filename,blob);t.managedPath="Songs/"+filename;t._diskDirty=false;
      }
      const usedArtists=new Set(),usedPlaylists=new Set(),usedFolders=new Set();
      for(const a of state.artists){const n=a.managedFolderName||managedUniqueName(artistDisplayName(a),a.id,usedArtists);usedArtists.add(n.toLowerCase());a.managedFolderName=n;await fsWriteText(await fsDir(artistsDir,n),"info.txt",JSON.stringify(managedInfo("artist",a),null,2))}
      for(const p of state.playlists){const n=p.managedFolderName||managedUniqueName(p.name,p.id,usedPlaylists);usedPlaylists.add(n.toLowerCase());p.managedFolderName=n;await fsWriteText(await fsDir(playlistsDir,n),"info.txt",JSON.stringify(managedInfo("playlist",p),null,2))}
      for(const f of (state.folders||[])){const n=f.managedFolderName||managedUniqueName(f.name,f.id,usedFolders);usedFolders.add(n.toLowerCase());f.managedFolderName=n;await fsWriteText(await fsDir(foldersDir,n),"info.txt",JSON.stringify(managedInfo("folder",f),null,2))}
      return true;
    }catch(e){console.warn("Localify managed folder sync failed",e);if(!opts.silent)toast("Library folder sync failed. Check the folder permission and free disk space.");return false}

  }

  function readFileImage(file){
    return new Promise(resolve=>{
      if(!file){resolve(null);return}
      let settled=false;
      const finish=data=>{if(settled)return;settled=true;resolve(data||null)};
      const fr=new FileReader();
      fr.onerror=()=>finish(null);
      fr.onload=()=>{
        const src=String(fr.result||"");
        if(!src){finish(null);return}
        const img=new Image();
        img.onload=()=>{
          try{
            const max=900,iw=img.naturalWidth||1,ih=img.naturalHeight||1,scale=Math.min(1,max/Math.max(iw,ih));
            const w=Math.max(1,Math.round(iw*scale)),h=Math.max(1,Math.round(ih*scale));
            const c=document.createElement("canvas");c.width=w;c.height=h;
            const ctx=c.getContext("2d",{alpha:true});
            if(!ctx){finish(src);return}
            ctx.drawImage(img,0,0,w,h);
            let out="";
            try{out=c.toDataURL("image/webp",.84)}catch{}
            finish(out&&out.startsWith("data:image/")?out:src);
          }catch{finish(src)}
        };
        img.onerror=()=>finish(src);
        img.src=src;
      };
      fr.readAsDataURL(file);
    });
  }

  function readDuration(t){
    return new Promise(resolve=>{
      const blob=t?.blob;
      if(!isBlobLike(blob)){resolve(0);return}
      const temp=document.createElement("audio");
      let url="",done=false,timer=0;
      const cleanup=()=>{
        if(done)return;
        done=true;clearTimeout(timer);
        temp.onloadedmetadata=null;temp.onerror=null;
        try{temp.removeAttribute("src");temp.load()}catch{}
        if(url)URL.revokeObjectURL(url);
      };
      const finish=d=>{
        const n=Number.isFinite(d)&&d>0?d:0;
        t.duration=n;cleanup();resolve(n);
      };
      temp.preload="metadata";
      temp.onloadedmetadata=()=>finish(temp.duration);
      temp.onerror=()=>finish(0);
      url=URL.createObjectURL(blob);
      temp.src=url;
      try{temp.load()}catch{}
      timer=setTimeout(()=>finish(0),5000);
    });
  }

  function readMetaFallback(){

      try{
        const raw=localStorage.getItem(key);

        const parsed=JSON.parse(raw);

  async function flushSave(showMessage=false){

    saveInFlight=true;dirtySave=false;
    const ids=[...pendingBlobIds];pendingBlobIds.clear();
    const deletes=[...pendingBlobDeletes];pendingBlobDeletes.clear();
    const meta=cloneMeta();
    let okMeta=false,failed=0,deleted=0,failedIds=[];
    if(!storageReady || storageBlocked){try{writeMetaFallback()}catch{}}
    try{await idbPutMeta(meta);okMeta=true;storageReady=true;storageBlocked=false}
    catch(e){storageBlocked=true;console.warn('Localify metadata save failed',e);try{writeMetaFallback()}catch{}}
    for(const id of ids){

      if(!isBlobLike(t?.blob))continue;
      try{await idbPutBlob(id,t.blob);t._blobDirty=false}catch(e){failed++;failedIds.push(id);console.warn('Localify audio save failed',id,e)}
    }
    for(const id of deletes){

    }
    if(failedIds.length){
      for(const id of failedIds)pendingBlobIds.add(id);

    }
    lastSaveAt=Date.now();
    saveInFlight=false;
    if(dirtySave)setTimeout(()=>flushSave(false),failedIds.length?5000:50);
    if(showMessage)toast(failed?'Saved, but '+failed+' audio file(s) could not be stored yet. Localify will retry automatically.':(okMeta?'Library saved on this device'+(deleted?' • '+deleted+' removed':'')+'.':'Metadata fallback saved; browser storage is blocked.'));

  function migrate(raw){

    const albumMap=new Map(state.albums.map(a=>[`${(a.title||"").toLowerCase()}|||${a.artistId||""}`,a]));
    const ensureA=name=>{
      const n=(name||"Unknown Artist").trim()||"Unknown Artist";const key=n.toLowerCase();
      if(artistMap.has(key))return artistMap.get(key);

      const key=`${(t.album||"Unknown Album").toLowerCase()}|||${aa.id}`;

  }

  async function loadPreviousV6Blobs(tracks){
    return new Promise(resolve=>{
      try{
        const req=indexedDB.open("localify-db-v6");
        req.onsuccess=()=>{
          const d=req.result;
          if(!d.objectStoreNames.contains("blobs")){d.close();resolve();return}
          const pending=[...tracks];let i=0;
          const step=()=>{
            if(i>=pending.length){d.close();resolve();return}
            const t=pending[i++];
            try{
              const r=d.transaction("blobs","readonly").objectStore("blobs").get(t.id);
              r.onsuccess=()=>{if(r.result)t.blob=r.result;step()};r.onerror=step;
            }catch{step()}
          };
          step();
        };
        req.onerror=()=>resolve();
      }catch{resolve()}
    });
  }

    state.catalogSorts=Object.assign({albums:"asc",artists:"asc",playlists:"asc",folders:"asc",songs:"asc"},state.catalogSorts||{});

    const repaired=repairAllLibraryMetadata();

    if(restored&&state._restoredFromFallback&&!storageBlocked){

    delete state._restoredFromFallback;

  function trackPrefixMatch(value){
    const raw=String(value||"").trim();
    return raw.match(/^0*(\d+)\s*(?:[.)-:]\s*|\s+(?=\D))/);
  }
  function trackNo(t){
    const explicit=parseInt(t?.track,10);
    if(Number.isFinite(explicit))return explicit;
    const m=trackPrefixMatch(t?.title);
    return m?parseInt(m[1],10):null;
  }
  function displayTrackTitle(t,removeTrackNumber=false){
    const title=String(t?.title||"");
    if(!removeTrackNumber)return title;
    const m=trackPrefixMatch(title);
    return m?title.slice(m[0].length).trim()||title:title;
  }
  function discNo(t){const n=parseInt(t?.disc,10);return Number.isFinite(n)?n:1}

  function getCatalogSort(kind){
    state.catalogSorts=Object.assign({albums:"asc",artists:"asc",playlists:"asc",folders:"asc",songs:"asc"},state.catalogSorts||{});

  function sortCatalogItems(kind,items,labelGetter){

  function getTrackSort(scope,defaultKey="title"){
    state.trackSorts=state.trackSorts||{};

    return s&&["track","title","artist","album","duration"].includes(s.key)?s:{key:defaultKey,dir:"asc"};

  function sortedTrackTableTracks(tracks,scope,defaultKey="title"){
    const s=getTrackSort(scope,defaultKey),dir=s.dir==="desc"?-1:1;
    const key=t=>s.key==="track"?(trackNo(t)??999999):s.key==="title"?displayTrackTitle(t,true):s.key==="artist"?artistName(t):s.key==="album"?albumName(t):Number(t.duration)||0;
    return [...tracks].sort((x,y)=>{
      const av=key(x),bv=key(y);
      const primary=typeof av==="number"&&typeof bv==="number"?av-bv:String(av).localeCompare(String(bv),undefined,{numeric:true,sensitivity:"base"});
      return primary*dir || String(displayTrackTitle(x,true)).localeCompare(String(displayTrackTitle(y,true)),undefined,{numeric:true,sensitivity:"base"});
    });
  }

  function normalizeCoverAlbumName(value){
    return String(value||"")
      .normalize("NFKC")
      .replace(/[\u2018\u2019\u201A\u201B\u2032`]/g,"'")

  function canonicalCoverAlbumName(value){

  function isExcludedCoverAlbum(albumTitle){

  function coverMapCandidates(albumTitle){
    const raw=String(albumTitle||"").trim();
    if(!raw)return [];
    const variants=new Set();
    const add=v=>{
      const text=String(v||"").trim();
      if(!text)return;
      const n=normalizeCoverAlbumName(text),c=canonicalCoverAlbumName(text);
      if(n)variants.add(n);if(c)variants.add(c);
    };
    const addAcronyms=v=>{
      const words=normalizeCoverAlbumName(v).replace(/&/g," and ").split(/[^a-z0-9]+/).filter(Boolean);
      const significant=words.filter(w=>!["the","a","an","of","and","to","in","on","for","with","by","from","at"].includes(w));
      if(words.length>1)add(words.map(w=>w[0]).join(""));
      if(significant.length>1)add(significant.map(w=>w[0]).join(""));
      if(significant.length>0)add(significant.join(" "));
    };
    add(raw);addAcronyms(raw);
    add(raw.replace(/[_-]+/g," "));
    add(raw.replace(/\s+/g," "));
    add(raw.replace(/[’'`]/g,""));
    const versionless=raw.replace(/\s*\(?\s*(?:v|ver|version)\.?\s*\d+(?:\.\d+)?\s*\)?\s*$/i,"").trim();
    if(versionless&&versionless!==raw){add(versionless);addAcronyms(versionless);}
    const stripped=raw
      .replace(/\s*\((?:final|complete|deluxe|revised|draft|edition|remastered|expanded|mixtape|mix[- ]?tape|album|official(?:\s+mixtape)?|the official(?:\s+mixtape)?)\)\s*$/i,"").trim()
      .replace(/\s+(?:final|complete|deluxe|revised|draft|edition|remastered|expanded|mixtape|mix[- ]?tape|album|official(?:\s+mixtape)?|the official(?:\s+mixtape)?)\s*$/i,"").trim();
    if(stripped&&stripped!==raw){add(stripped);addAcronyms(stripped);}
    const beforeColon=raw.split(/\s*:\s*/)[0].trim();
    if(beforeColon&&beforeColon!==raw){add(beforeColon);addAcronyms(beforeColon);}
    const beforeDash=raw.split(/\s+[–—-]\s+/)[0].trim();
    if(beforeDash&&beforeDash!==raw){add(beforeDash);addAcronyms(beforeDash);}
    const artistless=raw.replace(/^(?:kanye west|ye)\s*[-:|]\s*/i,"").replace(/\s*[-:|]\s*(?:kanye west|ye)$/i,"").trim();
    if(artistless&&artistless!==raw){add(artistless);addAcronyms(artistless);}
    add(raw.replace(/\bIII\b/gi,"3").replace(/\bII\b/gi,"2").replace(/\bI\b/gi,"1"));
    add(raw.replace(/\b3\b/gi,"III").replace(/\b2\b/gi,"II").replace(/\b1\b/gi,"I"));
    return [...variants];
  }
  function coverMapUrl(value){
    if(typeof value!=="string"||!value.trim())return "";
    const raw=value.trim();
    try{
      if(/^https?:\/\//i.test(raw)){
        const u=new URL(raw);
        if(u.protocol!=="http:"&&u.protocol!=="https:")return "";
        if(u.username||u.password)return "";
        return u.href;
      }
      const repoPath=raw.replace(/^\.\//,"").replace(/^\//,"");
      return new URL(repoPath,LOCALIFY_GITHUB_RAW_BASE).href;
    }catch{return ""}
  }

  function coverFileCandidates(albumTitle){
    const original=String(albumTitle||"").trim();
    if(!original||/^unknown album$/i.test(original)||isExcludedCoverAlbum(original))return [];
    const variants=[
      original,
      original.replace(/[\\/:*?"<>|]/g,"-").replace(/\s+/g," ").trim(),
      original.replace(/\s+/g,"_"),
      original.replace(/\s+/g,"-"),
      original.replace(/\s*[–—-]\s*/g,"-"),
      original.replace(/\s*\(?\s*(?:v|ver|version)\.?\s*\d+(?:\.\d+)?\s*\)?\s*$/i,"").trim()
    ].filter(Boolean);
    const seen=new Set(),out=[];
    for(const base of variants){
      for(const ext of LOCALIFY_COVER_EXTENSIONS){
        const candidate=base+ext;
        const key=candidate.toLowerCase();
        if(!seen.has(key)){seen.add(key);out.push(candidate)}
      }
    }
    return out;
  }

  let localifyBuiltinCoverLookup=null;

  function getBuiltinCoverLookup(){
    if(localifyBuiltinCoverLookup)return localifyBuiltinCoverLookup;
    const out=new Map();
    for(const [name,file] of Object.entries(LOCALIFY_BUILTIN_COVER_MAP)){
      if(typeof file!=="string"||!file.trim())continue;
      for(const key of coverMapCandidates(name))out.set(key,file.trim());
    }
    localifyBuiltinCoverLookup=out;
    return out;
  }

  function builtInCoverForAlbum(albumTitle){
    if(isExcludedCoverAlbum(albumTitle))return "";
    const lookup=getBuiltinCoverLookup();
    for(const key of coverMapCandidates(albumTitle)){
      const file=lookup.get(key);
      if(!file)continue;
      return new URL(encodeURIComponent(file),LOCALIFY_COVER_DIRECTORY).href;
    }
    return "";
  }

  function coverVersionInfo(value){
    const normalized=normalizeCoverAlbumName(value);
    const tokens=normalized.split(/[^a-z0-9]+/).filter(Boolean);
    const versions=tokens.filter(t=>/^\\d+(?:\\.\\d+)?$/.test(t));
    const words=tokens.filter(t=>!/^\\d+(?:\\.\\d+)?$/.test(t)&&!["v","ver","version"].includes(t));
    return {tokens,versions,words,wordKey:words.join(" "),versionKey:versions.join(".")};
  }
  function coverNameSimilarity(a,b){
    const x=canonicalCoverAlbumName(a),y=canonicalCoverAlbumName(b);
    if(!x||!y)return 0;
    const pa=coverVersionInfo(a),pb=coverVersionInfo(b);
    if(pa.versionKey!==pb.versionKey)return 0;
    if(x===y)return 1;
    const aw=pa.words,bw=pb.words;
    if(!aw.length||!bw.length)return 0;
    const sa=new Set(aw),sb=new Set(bw);
    const common=[...sa].filter(w=>sb.has(w));
    const overlap=common.length/Math.max(sa.size,sb.size);
    return overlap===1?0.96:0;
  }
  function externalCoverForAlbum(albumTitle){
    if(!localifyCoverMap||isExcludedCoverAlbum(albumTitle))return "";
    const candidates=coverMapCandidates(albumTitle);
    for(const key of candidates){
      const value=localifyCoverMap[key];
      const mapped=coverMapUrl(value||"");
      if(mapped)return mapped;
    }
    const fileIndex=localifyCoverFileIndex||{};
    for(const key of candidates){
      const file=fileIndex[key];
      if(file){
        const url=new URL(encodeURIComponent(file),LOCALIFY_COVER_DIRECTORY).href;
        return url;
      }
    }
    let best="",score=0;
    for(const [key,value] of Object.entries(localifyCoverMap)){
      const mapped=coverMapUrl(value||"");
      if(!mapped)continue;
      for(const candidate of candidates){
        const match=coverNameSimilarity(candidate,key);
        if(match>score){score=match;best=mapped;}
      }
    }
    if(score>=0.96)return best;
    for(const [key,file] of Object.entries(fileIndex)){
      for(const candidate of candidates){
        const match=coverNameSimilarity(candidate,key);
        if(match>score){score=match;best=new URL(encodeURIComponent(file),LOCALIFY_COVER_DIRECTORY).href;}
      }
    }
    return score>=0.96?best:"";
  }
  function knownCoverUrlForAlbum(albumTitle){
    return externalCoverForAlbum(albumTitle)||builtInCoverForAlbum(albumTitle)||"";
  }
  function repoCoverFile(value){
    if(typeof value!=="string"||!value.trim())return "";
    const mapped=coverMapUrl(value);
    if(!mapped||!mapped.startsWith(LOCALIFY_COVER_DIRECTORY))return "";
    try{return decodeURIComponent(mapped.slice(LOCALIFY_COVER_DIRECTORY.length));}catch{return mapped.slice(LOCALIFY_COVER_DIRECTORY.length);}
  }
  function isKnownLocalifyCover(value){
    const file=repoCoverFile(value);
    if(!file)return false;
    if(Object.values(LOCALIFY_BUILTIN_COVER_MAP).some(v=>String(v).trim()===file))return true;
    if(localifyCoverMap&&Object.values(localifyCoverMap).some(v=>repoCoverFile(v)===file))return true;
    return false;
  }
  function safeExistingCover(albumTitle,existingCover=""){

  function coverForAlbum(album,existingCover=""){

  function coverFileStem(name){

  async function loadLocalifyCoverFileIndex(){
    if(localifyCoverFileIndex)return localifyCoverFileIndex;
    if(localifyCoverFileIndexPromise)return localifyCoverFileIndexPromise;
    localifyCoverFileIndexPromise=(async()=>{
      const out={};
      try{
        const controller=new AbortController();
        const timeout=setTimeout(()=>controller.abort(),LOCALIFY_COVER_LOAD_TIMEOUT);
        try{
          const r=await fetch("https://api.github.com/repos/blibbbye/Localify/contents/covers?ref=main",{cache:"no-store",signal:controller.signal,credentials:"omit"});
          if(!r.ok)throw new Error(`HTTP ${r.status}`);
          const files=await r.json();
          if(Array.isArray(files)){
            for(const item of files){
              if(!item||item.type!=="file"||!LOCALIFY_COVER_EXTENSIONS.some(ext=>String(item.name||"").toLowerCase().endsWith(ext)))continue;
              const file=String(item.name||"");
              for(const key of coverMapCandidates(coverFileStem(file)))out[key]=file;
            }
          }
        }finally{clearTimeout(timeout)}
      }catch(e){console.warn("Localify cover directory index could not be loaded.",e)}
      localifyCoverFileIndex=out;return out;
    })();
    return localifyCoverFileIndexPromise;
  }

  async function loadLocalifyCoverMap(){
    if(localifyCoverMap)return localifyCoverMap;
    if(localifyCoverMapPromise)return localifyCoverMapPromise;
    const out={};
    // External JSON is an extension, not a replacement. The built-in map is
    // always available and is intentionally copied under normalized keys.
    for(const [k,v] of Object.entries(LOCALIFY_BUILTIN_COVER_MAP)){
      if(typeof v!=="string"||!v.trim())continue;
      for(const key of coverMapCandidates(k))out[key]=v.trim();
    }
    // The registry is hosted publicly, so it can be loaded from any page origin.
    localifyCoverMapPromise=(async()=>{
      try{
        const controller=new AbortController();
        const timeout=setTimeout(()=>controller.abort(),LOCALIFY_COVER_LOAD_TIMEOUT);
        try{
          const r=await fetch(LOCALIFY_COVER_MAP_URL,{cache:"no-store",signal:controller.signal,credentials:"omit"});
          if(!r.ok)throw new Error(`HTTP ${r.status}`);
          const data=await r.json();
          const raw=data&&typeof data.covers==="object"?data.covers:data;
          if(raw&&typeof raw==="object"&&!Array.isArray(raw)){
            for(const [k,v] of Object.entries(raw)){
              if(typeof v!=="string"||!v.trim())continue;
              const value=v.trim();
              for(const key of coverMapCandidates(k))out[key]=value;
            }
          }
        }finally{clearTimeout(timeout)}
      }catch(e){console.warn("Localify covers.json could not be loaded; built-in cover map remains active.",e)}
      localifyCoverMap=out;return out;
    })();
    return localifyCoverMapPromise;
  }

  function checkImageUrl(url,timeoutMs=LOCALIFY_COVER_LOAD_TIMEOUT){
    return new Promise(resolve=>{
      if(!url){resolve(false);return}
      const img=new Image();let done=false;
      const timer=setTimeout(()=>finish(false),timeoutMs);
      const finish=ok=>{if(done)return;done=true;clearTimeout(timer);img.onload=null;img.onerror=null;resolve(!!ok)};
      img.onload=()=>finish(true);img.onerror=()=>finish(false);img.src=url;
    });
  }

  async function resolveGithubAlbumCover(t){
    if(!t)return "";
    const album=trackCoverReference(t);
    const cacheKey=normalizeCoverAlbumName(album);
    if(!cacheKey||/^unknown album$/.test(cacheKey)||/^none$/.test(cacheKey)||isExcludedCoverAlbum(album)){return ""}
    if(discordCoverCache.has(cacheKey))return discordCoverCache.get(cacheKey)||"";
    if(discordCoverRequests.has(cacheKey))return discordCoverRequests.get(cacheKey);
    const request=(async()=>{
      const a=albumById(t?.albumId);
      const explicit=[t?.discordCoverUrl,a?.discordCoverUrl].find(v=>typeof v==="string"&&/^https:\/\/[^\s]+$/i.test(v.trim()));
      if(explicit&&await checkImageUrl(explicit.trim()))return explicit.trim();
      await Promise.all([loadLocalifyCoverMap(),loadLocalifyCoverFileIndex()]);
      const external=externalCoverForAlbum(album);
      if(external&&await checkImageUrl(external)){discordCoverCache.set(cacheKey,external);return external;}
      const builtin=builtInCoverForAlbum(album);
      if(builtin&&await checkImageUrl(builtin)){discordCoverCache.set(cacheKey,builtin);return builtin;}
      for(const filename of coverFileCandidates(album)){
        const url=new URL(encodeURIComponent(filename),LOCALIFY_COVER_DIRECTORY).href;
        if(await checkImageUrl(url)){discordCoverCache.set(cacheKey,url);return url}
      }
      discordCoverCache.delete(cacheKey);
      return "";
    })();
    discordCoverRequests.set(cacheKey,request);
    try{return await request}finally{discordCoverRequests.delete(cacheKey)}
  }

  async function checkDesktopPlayer(){
    if(state.settings.discordPresence===false){setDiscordUi("disabled","Discord Rich Presence is off");return}
    try{
      const r=await fetch("http://127.0.0.1:4219/health",{cache:"no-store",targetAddressSpace:"loopback"});
      if(!r.ok){setDiscordUi("error","Localify Discord Connector is not responding");return}
      const m=await r.json();
      if(!m?.desktopPlayer){setDiscordUi("error","Start Localify Discord Connector");return}
      if(m.discordConnected)setDiscordUi("connected","Discord connected");
      else if(m.discordState===4)setDiscordUi("error","Setup needed: add a Discord Application ID in connector Settings");
      else if(m.discordState===2)setDiscordUi("searching","Open Discord Desktop, then press Reconnect");
      else if(m.discordState===5||m.discordState===6)setDiscordUi("error",String(m.discordStatus||"Discord connection error").slice(0,70));
      else setDiscordUi("searching",String(m.discordStatus||"Waiting for Discord Desktop…").slice(0,70));
      const t=trackById(state.currentId);
      if(t&&!audio.paused)sendDiscordPresence(true);
    }catch(e){
      setDiscordUi("error","Allow local-network access for Localify");
    }
  }
  async function pollDesktopControl(){
    try{
      const r=await fetch("http://127.0.0.1:4219/control?since="+encodeURIComponent(desktopControlSeq),{
        cache:"no-store",targetAddressSpace:"loopback"
      });
      if(!r.ok)return;
      const m=await r.json();
      if(!Number.isFinite(+m.seq)||+m.seq<=desktopControlSeq)return;
      desktopControlSeq=+m.seq;
      if(m.action==="toggle"){if(audio.paused)audio.play().catch(()=>{});else audio.pause()}
      else if(m.action==="next")next();
      else if(m.action==="prev")prev();
      else if(m.action==="play")audio.play().catch(()=>{});
      else if(m.action==="pause")audio.pause();
      else if(m.action==="seek"&&Number.isFinite(+m.value)&&audio.duration)audio.currentTime=Math.max(0,Math.min(audio.duration,+m.value));
      else if(m.action==="volume"&&Number.isFinite(+m.value)){
        const v=Math.max(0,Math.min(1,+m.value));state.settings.volume=v;audio.volume=v;await save();renderPlayer();sendDiscordPresence(true);
      }else if(m.action==="shuffle"){
        state.settings.shuffle=!state.settings.shuffle;
        if(state.settings.shuffle&&state.currentId&&state.queue.length){
          const current=state.currentId;state.queue=[current,...shuffleArr(state.queue.filter(id=>id!==current))];state.queueIndex=0;
        }
        await save();renderPlayer();renderCurrentViewWithoutScroll();sendDiscordPresence(true);
      }else if(m.action==="repeat"){
        state.settings.repeat=state.settings.repeat==="off"?"all":state.settings.repeat==="all"?"one":"off";
        await save();renderPlayer();sendDiscordPresence(true);
      }
    }catch{}
  }

    const artists=artistNamesForTrack(t).map(x=>sanitizeDiscordText(x,"")).filter(Boolean);
    const artist=sanitizeDiscordText(artists.join(", "),"Unknown Artist");
    const album=albumById(t?.albumId);
    const explicitCover=[t?.discordCoverUrl,album?.discordCoverUrl].find(v=>typeof v==="string"&&/^https:\/\/[^\s]+$/i.test(v.trim()));
    let coverUrl=explicitCover?explicitCover.trim():"";

      try{coverUrl=await resolveGithubAlbumCover(t)}catch(e){console.warn("Localify Discord cover resolver failed",e)}

  async function sendDiscordPresence(force=false){
    if(state.settings.discordPresence===false)return;
    const requestId=++discordPresenceRequest;
    const t=trackById(state.currentId);
    if(!t||audio.paused){sendDiscordMessage({kind:"clear"});return}
    repairImportedTrackMetadata(t);

    // Publish the status immediately with any already-known cover. Do not wait
    // for album-name/filename probing, otherwise albums without a matching
    // cover could make Discord appear completely broken for a long time.
    let p;
    try{p=await discordPayload(t,true,false)}catch(e){
      console.warn("Localify Discord payload build failed",e);
      const localArtwork=await localArtworkForDiscord(t).catch(()=>({data:"",key:"none:"+String(t.id||"track")}));
      p={kind:"presence",playing:true,song:sanitizeDiscordText(displayTrackTitle(t,true),"Unknown song"),artist:sanitizeDiscordText(artistName(t),"Unknown Artist"),coverUrl:discordDirectCoverUrl(t),localCoverData:localArtwork.data,localCoverKey:localArtwork.key,currentTime:Number(audio.currentTime||0),duration:Number(audio.duration||t?.duration||0),start:Math.round(Date.now()-Number(audio.currentTime||0)*1000),end:0,volume:Number(state.settings.volume??.9),shuffle:!!state.settings.shuffle,repeat:state.settings.repeat||"off"};

    const key=[p.song,p.artist,p.coverUrl,Math.floor(p.currentTime/5),Math.round(p.duration)].join("|"),now=Date.now();
    if(force||key!==discordLastPayloadKey||now-discordLastSentAt>=4500){

      window.dispatchEvent(new CustomEvent("localify:discord-presence",{detail:p}));window.LocalifyDiscordPresence=p;

    // same song only if the user is still listening to it.

      if(resolvedCover===p.coverUrl)return;

      const updated={...p,coverUrl:resolvedCover,currentTime:Number(audio.currentTime||p.currentTime||0)};
      const updatedKey=[updated.song,updated.artist,updated.coverUrl,Math.floor(updated.currentTime/5),Math.round(updated.duration)].join("|");
      if(updatedKey===discordLastPayloadKey)return;
      discordLastPayloadKey=updatedKey;discordLastSentAt=Date.now();void sendDiscordToDesktop(updated);sendDiscordMessage(updated);
      window.dispatchEvent(new CustomEvent("localify:discord-presence",{detail:updated}));window.LocalifyDiscordPresence=updated;
    }).catch(e=>console.warn("Localify background Discord cover lookup failed",e));
  }

  function dominantArtworkColor(src){

        __artworkAccentCache.set(src,color);resolve(color);

      img.onload=()=>{

          const canvas=document.createElement("canvas");canvas.width=40;canvas.height=40;
          const ctx=canvas.getContext("2d",{willReadFrequently:true});if(!ctx)throw new Error("Canvas unavailable");
          ctx.drawImage(img,0,0,40,40);

          let total=0,allR=0,allG=0,allB=0;

          if(best.weight>.5)done(artworkMixHex(artworkRgbToHex(best.r/best.weight,best.g/best.weight,best.b/best.weight),"#e3e5e9",.14));

    });

  async function playCurrent(){

      return;

    try{
      audio.preload="auto";

  async function pickFolder(){
    importContext={};

    // Prefer the modern File System Access API on phones/browsers that expose it.
    // This gives an actual folder picker instead of the browser falling back to a file picker.
    if(window.showDirectoryPicker){
      try{
        const root=await window.showDirectoryPicker({mode:"read"});
        const files=[];
        const images=[];
        const walk=async(dir,parts=[])=>{
          for await(const [name,handle] of dir.entries()){
            if(handle.kind==="file") {
              const file=await handle.getFile();
              const rel=[...parts,name].join("/");
              try{Object.defineProperty(file,"webkitRelativePath",{value:rel,configurable:true})}catch{}
              if(isAudioFile(file))files.push(file);
              else if((file.type||"").startsWith("image/")||/\.(png|jpe?g|webp|gif|bmp)$/i.test(name))images.push(file);
            } else if(handle.kind==="directory") {
              await walk(handle,[...parts,name]);
            }
          }
        };
        await walk(root,[]);
        if(!files.length){toast("No audio files found in that folder.");return}
        const byDir=new Map();
        for(const img of images){
          const rel=img.webkitRelativePath||img.name;
          const dir=rel.includes("/")?rel.slice(0,rel.lastIndexOf("/")):"";
          if(!byDir.has(dir))byDir.set(dir,await readFileImage(img));
        }
        await addFiles(files,{folderImageMap:byDir,folderImport:true});
        return;
      }catch(e){
        if(e?.name==="AbortError")return;
        console.warn("Modern folder picker failed, falling back:",e);
      }
    }

    const input=$("#directoryPicker");
    if(!input){toast("Folder import is not supported in this browser.");return}
    input.value="";
    input.onchange=async e=>{
      const files=[...e.target.files];
      const imageFiles=files.filter(f=>(f.type||"").startsWith("image/")||/\.(png|jpe?g|webp|gif|bmp)$/i.test(f.name));
      const byDir=new Map();
      for(const img of imageFiles){
        const rel=img.webkitRelativePath||img.name;
        const dir=rel.includes("/")?rel.slice(0,rel.lastIndexOf("/")):"";
        if(!byDir.has(dir))byDir.set(dir,await readFileImage(img));
      }
      await addFiles(files.filter(isAudioFile),{folderImageMap:byDir,folderImport:true});
      input.value="";
    };
    input.click();
  }
  function metadataText(bytes,encoding){
    const data=bytes instanceof Uint8Array?bytes:new Uint8Array(bytes);
    try{
      if(encoding===0)return new TextDecoder("iso-8859-1").decode(data).replace(/\0+$/,"").trim();
      if(encoding===2){let s="";for(let i=0;i+1<data.length;i+=2)s+=String.fromCharCode((data[i]<<8)|data[i+1]);return s.replace(/\0+$/,"").trim()}
      if(encoding===1){const little=data[0]===0xff&&data[1]===0xfe;let off=(data[0]===0xff||data[0]===0xfe)?2:0,s="";for(;off+1<data.length;off+=2)s+=String.fromCharCode(little?(data[off]|data[off+1]<<8):(data[off+1]|data[off]<<8));return s.replace(/\0+$/,"").trim()}
      return new TextDecoder("utf-8").decode(data).replace(/\0+$/,"").trim();
    }catch{return ""}
  }

      const fs=version===4?((bytes[pos+4]&127)<<21)|((bytes[pos+5]&127)<<14)|((bytes[pos+6]&127)<<7)|(bytes[pos+7]&127):((bytes[pos+4]<<24|bytes[pos+5]<<16|bytes[pos+6]<<8|bytes[pos+7])>>>0);

  async function addFiles(files,context={}){
    const arr=files.filter(isAudioFile);

    const album=context.albumId?albumById(context.albumId):null;
    const playlist=context.playlistId?playlistById(context.playlistId):null;
    const folderAlbums=new Map();

      const albumArtistNames=metadataList(meta.albumArtist);

        const aa=albumArtists[0]||trackArtists[0]||null;
        al=getOrCreateAlbum(metaAlbum,aa,folderCover||null);

      }else if(!al&&context.folderImport){
        const key=folderKey.toLowerCase();

      }
      if(folderCover&&al&&!al.cover)al.cover=folderCover;
      const year=String(meta.year||"").trim(),genre=String(meta.genre||"").trim();

        if(meta.publisher)al.label=String(meta.publisher);
        al.credits=normalizeCredits({...al.credits,composer:meta.composer||al.credits?.composer,publisher:meta.publisher||al.credits?.publisher,copyright:meta.copyright||al.credits?.copyright});
      }
      const artistIds=trackArtists.map(a=>a.id),artistTextValue=namesOfIds(artistIds).join(", ")||NONE_LABEL;
      const title=String(meta.title||"").trim()||String(f.name||"").replace(/\.[^.]+$/,"");
      const trackNumber=Number.isFinite(Number(meta.track))?Number(meta.track):inferTrackNumberFromFilename(f.name);
      const discNumber=Number.isFinite(Number(meta.disc))?Number(meta.disc):null;
      const albumIds=al&&artistIdsForAlbum(al).length?artistIdsForAlbum(al):albumArtists.map(a=>a.id);
      const t={
        id:uid(),title,artist:artistTextValue,artistIds,artistId:artistIds[0]||null,
        album:al?.title||metaAlbum||NONE_LABEL,albumId:al?.id||null,
        albumArtist:namesOfIds(albumIds).join(", ")||artistTextValue,albumArtistIds:albumIds,albumArtistId:albumIds[0]||null,
        genre:genre||al?.genre||"",year:year||al?.year||"",track:trackNumber,disc:discNumber,
        explicit:false,duration:0,fileName:f.name,size:f.size,lastModified:f.lastModified,mimeType:f.type||"",
        blob:f,_blobDirty:true,cover:al?.cover||trackArtists[0]?.image||folderCover||null,
        lyrics:"",credits:normalizeCredits({composer:meta.composer||al?.credits?.composer,publisher:meta.publisher||al?.credits?.publisher,copyright:meta.copyright||al?.credits?.copyright,producer:al?.credits?.producer,songwriter:al?.credits?.songwriter,label:al?.credits?.label}),
        metadata:{title:meta.title||"",artist:meta.artist||"",album:meta.album||"",albumArtist:meta.albumArtist||"",year:meta.year||"",genre:meta.genre||"",track:meta.track||null,disc:meta.disc||null,composer:meta.composer||"",publisher:meta.publisher||"",copyright:meta.copyright||"",encoder:meta.encoder||""},
        addedAt:Date.now(),_diskDirty:!!state.libraryFolderHandle

      state.tracks.push(t);added.push(t);existing.add(sig);queueBlob(t.id);
      if(playlist&&!playlist.trackIds.includes(t.id))playlist.trackIds.push(t.id);
    }
    importContext={};
    if(!added.length){toast("Nothing new was imported.");return}
    save(false,added.map(t=>t.id));
    if(!context.skipManagedSync)scheduleManagedLibrarySync();

    (async()=>{
      let cursor=0;

  }

  function ensureAudioGraph(){

      eqNodes.gain.gain.value=1;eqNodes.output.gain.value=.82;

  function setAudioParam(param,value){

  function applyEQ(){
    if(!eqNodes)return;
    const q={bass:0,mid:0,treble:0,gain:0,...(state.settings.eq||{})};
    const bass=Math.max(-24,Math.min(24,Number(q.bass)||0)),mid=Math.max(-24,Math.min(24,Number(q.mid)||0)),treble=Math.max(-24,Math.min(24,Number(q.treble)||0)),userGain=Math.max(-12,Math.min(12,Number(q.gain)||0));
    setAudioParam(eqNodes.bass.gain,bass);setAudioParam(eqNodes.mid.gain,mid);setAudioParam(eqNodes.treble.gain,treble);

  async function writePresetStreaming(handle,manifest){
    // Large Chromium/Brave exports are much more reliable when we batch the
    // underlying audio stream into multi-megabyte writes instead of issuing
    // tens of thousands of tiny File System Access API writes.

    };
    try{
      await writeWithRetry(mh);
      await writeWithRetry(mb);

      offset+=mh.length+mb.length;
      let done=0,totalBytes=mh.length+mb.length;

      for(const t of manifest.tracks){
        const src=trackById(t.id),blob=src?await ensureTrackBlob(src):null;

        };

      // A single close can occasionally race Chromium's large-file commit.
      // Retry with a fresh event-loop turn before reporting failure.
      for(let attempt=0;attempt<3&&!closed;attempt++){
        try{
          await writable.close();
          closed=true;
        }catch(e){
          if(attempt===2)throw e;

  async function exportPreset(kind,ids=[],options=null){
  let handle=null;
  try{
    if(window.showSaveFilePicker)handle=await window.showSaveFilePicker({suggestedName:`Localify-${kind==='full'&&options?'library':kind}.localify`,types:[{description:'Localify Preset',accept:{'application/octet-stream':['.localify']}}]});
    await flushSave(false);
    const manifest=await collectPresetMeta(kind,ids,options);
    if(handle){
      await writePresetStreaming(handle,manifest);
      await openPresetImagePreview(manifest);
      return true;
    }
    const entries=[{name:'library.json',bytes:new TextEncoder().encode(JSON.stringify(manifest))}];
    for(const t of manifest.tracks){
      const src=trackById(t.id),blob=src?await ensureTrackBlob(src):null;
      if(isBlobLike(blob))entries.push({name:t.audioFile,bytes:await blobToBytes(blob)});
    }
    downloadBlob(await makeZip(entries),`Localify-${kind==='full'&&options?'library':kind}.localify`);
    toast(`${manifest.presetName} exported.`);
    await openPresetImagePreview(manifest);
    return true;
  }catch(e){
    if(e?.name==='AbortError')return false;
    console.error(e);
    toast(e?.message||'Could not export this preset.');
    return false;
  }
}

  async function readPresetFile(file){
    if(!file)throw new Error('No backup file was selected.');
    if(!file.size)throw new Error('The backup file is empty.');
    let p,files=null;
    try{
      const head=new Uint8Array(await file.slice(0,4).arrayBuffer());
      if(head[0]===0x50&&head[1]===0x4b&&head[2]===0x03&&head[3]===0x04){
        files=await parseZip(file);
        const mf=files.get('library.json');
        if(!mf)throw new Error('This Localify file is missing library.json.');
        p=JSON.parse(new TextDecoder().decode(await zipEntryBytes(mf)));
      }else{
        let raw;try{raw=await file.arrayBuffer()}catch(e){throw new Error('The preset could not be read. The file may be unavailable or too large for this browser.')}
        p=JSON.parse(new TextDecoder().decode(raw));
      }
    }catch(e){
      if(e instanceof SyntaxError)throw new Error('The Localify file is damaged or is not valid JSON.');
      throw e;
    }
    if(!p||typeof p!=='object')throw new Error('Invalid Localify backup.');
    if(!Array.isArray(p.tracks)&&!Array.isArray(p.artists)&&!Array.isArray(p.albums)&&!Array.isArray(p.playlists)&&!p.settings)throw new Error('Invalid Localify backup: no supported library data was found.');
    p.presetKind=p.presetKind||'full';
    if(!['full','artists','albums','songs','playlists','liked','recent','settings'].includes(p.presetKind))throw new Error('Unsupported Localify backup type: '+String(p.presetKind)+'.');
    const missing=[],badPaths=[];
    if(Array.isArray(p.tracks)){
      for(const t of p.tracks){
        if(!t||!t.audioFile)continue;
        const name=String(t.audioFile);
        if(name.startsWith('/')||name.includes('..'))badPaths.push(name);
        else if(!files||!files.has(name))missing.push(String(t.title||t.fileName||t.id||'Unknown song'));
        else if(Number.isFinite(Number(t.audioSize))&&Number(t.audioSize)>0&&files.get(name).size!==Number(t.audioSize))throw new Error('Audio data for “'+String(t.title||'Unknown song').slice(0,100)+'” is incomplete.');
      }
    }
    if(badPaths.length)throw new Error('This preset contains an invalid audio path.');
    if(missing.length){
      const shown=missing.slice(0,5).map(x=>'“'+String(x).slice(0,80)+'”').join(', ');
      const more=missing.length>5?' and '+(missing.length-5)+' more':'';
      throw new Error('This preset is incomplete: '+missing.length+' song'+(missing.length===1?' is':'s are')+' missing its audio data: '+shown+more+'.');
    }

  for(let gi=0;gi<visibleRows.length;gi++){
    const g=visibleRows[gi],x0=outer+gi*(colW+gap),y0=headerH;
    ctx.fillStyle="#0f151b";ctx.strokeStyle="#252e37";ctx.lineWidth=1;
    ctx.beginPath();ctx.roundRect(x0,y0,colW,headH+g.items.length*rowH+14,16);ctx.fill();ctx.stroke();
    ctx.fillStyle="#f7f7f8";ctx.font="900 21px Arial";ctx.fillText(g.label,x0+16,y0+28);
    ctx.fillStyle="#71808d";ctx.font="700 10px Arial";
    const ct=(g.kind==="personal"?g.items.length:Number(g.items.length)).toLocaleString();
    const tw=ctx.measureText(ct).width;ctx.fillText(ct,x0+colW-16-tw,y0+27);

    for(let i=0;i<g.items.length;i++){
      const x=g.items[i],y=y0+headH+i*rowH;
      ctx.strokeStyle="rgba(255,255,255,.045)";
      if(i)ctx.beginPath(),ctx.moveTo(x0+12,y),ctx.lineTo(x0+colW-12,y),ctx.stroke();
      const artSize=54,ax=x0+12,ay=y+10;
      if(g.kind==="folders"){
        const covers=folderCovers(x);
        if(covers.length){
          for(let j=0;j<4;j++){
            const u=covers[j],sx=ax+(j%2)*27,sy=ay+Math.floor(j/2)*27;
            const im=u?await loadImg(u):null;
            if(im){ctx.save();ctx.beginPath();ctx.rect(sx,sy,27,27);ctx.clip();const sc=Math.max(27/(im.naturalWidth||im.width||1),27/(im.naturalHeight||im.height||1));const dw=(im.naturalWidth||im.width||1)*sc,dh=(im.naturalHeight||im.height||1)*sc;ctx.drawImage(im,sx+(27-dw)/2,sy+(27-dh)/2,dw,dh);ctx.restore();}
            else{ctx.fillStyle="#1a2027";ctx.fillRect(sx,sy,27,27);}
          }
        }else{ctx.fillStyle="#1a2027";ctx.beginPath();ctx.roundRect(ax,ay,54,54,10);ctx.fill();ctx.fillStyle="#697682";ctx.font="900 25px Arial";ctx.fillText("▣",ax+16,ay+36)}
      }else if(g.kind!=="personal"){
        const im=await loadImg(coverOf(x));
        ctx.fillStyle="#172029";ctx.beginPath();ctx.roundRect(ax,ay,artSize,artSize,10);ctx.fill();
        if(im){ctx.save();ctx.beginPath();ctx.roundRect(ax,ay,artSize,artSize,10);ctx.clip();const sc=Math.max(artSize/(im.naturalWidth||im.width||1),artSize/(im.naturalHeight||im.height||1));const dw=(im.naturalWidth||im.width||1)*sc,dh=(im.naturalHeight||im.height||1)*sc;ctx.drawImage(im,ax+(artSize-dw)/2,ay+(artSize-dh)/2,dw,dh);ctx.restore()}
        else{ctx.fillStyle="#63717e";ctx.font="900 23px Arial";ctx.fillText(g.kind==="artists"?"♟":g.kind==="playlists"?"☷":"♫",ax+18,ay+35)}
      }else{
        ctx.fillStyle="#172029";ctx.beginPath();ctx.roundRect(ax,ay,54,54,10);ctx.fill();
        ctx.fillStyle="#7dd3fc";ctx.font="900 15px Arial";ctx.fillText("•",ax+21,ay+32);
      }
      const [title,sub,meta]=lineData(g,x);
      const tx=x0+78,clipW=colW-92;
      ctx.save();ctx.beginPath();ctx.rect(tx,y+6,clipW,rowH-8);ctx.clip();
      ctx.fillStyle="#f1f4f7";ctx.font="850 14px Arial";ctx.fillText(title.slice(0,42),tx,y+28);
      ctx.fillStyle="#81909c";ctx.font="600 10px Arial";if(sub)ctx.fillText(sub.slice(0,54),tx,y+45);
      ctx.fillStyle="#64727e";ctx.font="600 9px Arial";if(meta)ctx.fillText(meta.slice(0,54),tx,y+59);
      ctx.restore();
    }
  }

  const footerY=height-18;
  ctx.fillStyle="#66737f";ctx.font="700 11px Arial";
  const creator=txt(manifest.creatorName,"Localify listener");
  let footer="Preset made by \""+creator+"\"";
  if(hiddenSongCount)footer+=" • "+hiddenSongCount.toLocaleString()+" songs included in the backup file (not shown in image)";
  if(totalHidden)footer+=" • "+totalHidden.toLocaleString()+" more items included in the backup file";
  ctx.fillText(footer,outer,footerY);
  return canvas.toDataURL("image/png");
}

function formatPresetSeconds(sec){
  sec=Number(sec)||0;
  const d=Math.floor(sec/86400),h=Math.floor((sec%86400)/3600),m=Math.floor((sec%3600)/60);
  if(d)return d+"d "+h+"h";
  if(h)return h+"h "+m+"m";
  return m+"m";
}

  window.addEventListener("keydown",e=>{if(e.code==="Space"&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){e.preventDefault();$("#playPause").click()}if(e.key==="ArrowRight"&&e.shiftKey)next();if(e.key==="ArrowLeft"&&e.shiftKey)prev()});
  if("mediaSession"in navigator){const set=(n,f)=>{try{navigator.mediaSession.setActionHandler(n,f)}catch{}};set("play",()=>audio.play());set("pause",()=>audio.pause());set("previoustrack",prev);set("nexttrack",next)}
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"){creditListeningTime();save(false)}});

document.addEventListener("click",profileMenuSettingsCapture,true);

    if("requestIdleCallback"in window)requestIdleCallback(warmFirst,{timeout:1500});else setTimeout(warmFirst,700);
  })();
})();
