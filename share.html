<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Localify Share</title>
<meta name="description" content="A Localify library preview.">
<meta property="og:type" content="website">
<meta property="og:title" content="Localify Library">
<meta property="og:description" content="A shared Localify library preview.">
<meta property="og:image" content="https://raw.githubusercontent.com/blibbbye/Localify/main/icon.svg?v=20261025">
<meta name="theme-color" content="#7dd3fc">
<style>
:root{color-scheme:dark;--bg:#07090c;--panel:#0d1116;--panel2:#11171d;--panel3:#151c23;--line:#252d36;--text:#f5f7fa;--muted:#87929f;--accent:#7dd3fc;--glow:rgba(125,211,252,.10)}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;min-height:100vh;background:radial-gradient(900px 520px at 50% -15%,var(--glow),transparent 65%),linear-gradient(#090b0f,#06080b 70%);font:14px Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--text)}
button,input{font:inherit}.wrap{max-width:1080px;margin:auto;padding:22px 16px 56px}.top{display:flex;align-items:center;gap:12px}.brand{display:flex;align-items:center;gap:9px;font-weight:950;letter-spacing:-.4px}.logo{width:34px;height:34px;border-radius:10px;overflow:hidden;background:var(--accent);box-shadow:0 8px 28px var(--glow)}.logo img{width:100%;height:100%;object-fit:cover}.shareChip{margin-left:auto;color:#aab4bf;border:1px solid var(--line);background:rgba(13,17,22,.9);padding:8px 10px;border-radius:999px;font-size:11px;font-weight:800}
.hero{margin-top:18px;padding:22px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,#12181e,#0b1015);box-shadow:0 24px 80px rgba(0,0,0,.35)}.heroGrid{display:grid;grid-template-columns:160px minmax(0,1fr);gap:20px;align-items:center}.coverWall{width:160px;height:160px;border-radius:20px;overflow:hidden;display:grid;grid-template-columns:1fr 1fr;background:#151b21;box-shadow:0 18px 45px rgba(0,0,0,.35)}.coverWall img,.miniArt img{width:100%;height:100%;object-fit:cover}.coverCell{min-width:0;min-height:0;background:linear-gradient(145deg,#1a222b,#0d1217);display:grid;place-items:center;color:#607080;font-size:32px}.heroTitle{font-size:clamp(30px,5vw,52px);line-height:.98;letter-spacing:-2px;margin:0}.heroSub{color:var(--muted);margin-top:8px;line-height:1.5}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:16px}.stat{padding:12px 13px;border:1px solid var(--line);border-radius:14px;background:rgba(17,23,29,.92)}.stat b{display:block;font-size:23px}.stat span{color:#7f8a96;font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:850}
.tabs{display:flex;gap:7px;overflow:auto;padding:12px 0 3px;position:sticky;top:0;z-index:5;background:linear-gradient(180deg,#07090c 70%,transparent)}.tab{white-space:nowrap;padding:9px 13px;border:1px solid var(--line);border-radius:999px;background:#0e1318;color:#9ca7b2;font-weight:850;font-size:11px}.tab.active{background:var(--accent);border-color:var(--accent);color:#081017}
.toolbar{display:flex;gap:8px;align-items:center;margin:10px 0}.search{flex:1;min-width:0;background:#0f1419;border:1px solid var(--line);border-radius:12px;color:#fff;padding:10px 12px;outline:none}.search:focus{border-color:#46515e}.count{color:#76818c;font-size:11px}
.panel{border:1px solid var(--line);border-radius:17px;background:rgba(13,18,23,.94);overflow:hidden}.list{max-height:520px;overflow:auto}.row{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:11px;align-items:center;padding:9px 11px;border-top:1px solid rgba(255,255,255,.035)}.row:first-child{border-top:0}.row:hover{background:#141a20}.miniArt{width:42px;height:42px;border-radius:9px;overflow:hidden;background:#171d24;display:grid;place-items:center;color:#6a7785}.name{font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{margin-top:3px;color:#798591;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.badge{font-size:10px;color:#aeb7c0}.empty{padding:22px;color:#7f8a96;text-align:center}.footer{margin-top:16px;color:#687480;font-size:10px;line-height:1.5}
@media(max-width:650px){.heroGrid{grid-template-columns:1fr}.coverWall{width:112px;height:112px}.stats{grid-template-columns:repeat(2,1fr)}.wrap{padding-left:11px;padding-right:11px}.row{grid-template-columns:38px minmax(0,1fr) auto}.miniArt{width:38px;height:38px}}
</style>
</head>
<body>
<div class="wrap">
 <div class="top"><div class="brand"><div class="logo"><img src="https://raw.githubusercontent.com/blibbbye/Localify/main/icon.svg?v=20261025" alt=""></div><span>LOCALIFY</span></div><div class="shareChip">Shared library</div></div>
 <section class="hero">
  <div class="heroGrid"><div class="coverWall" id="coverWall"><div class="coverCell">♫</div><div class="coverCell">♫</div><div class="coverCell">♫</div><div class="coverCell">♫</div></div><div><h1 class="heroTitle" id="title">Localify Library</h1><div class="heroSub" id="subtitle">Loading preview…</div><div class="stats" id="stats"></div></div></div>
 </section>
 <div class="tabs" id="tabs"></div>
 <div class="toolbar"><input id="search" class="search" placeholder="Search this preview…"><span id="count" class="count"></span></div>
 <div class="panel"><div id="list" class="list"></div></div>
 <div class="footer">This is a lightweight preview link. Audio files are not included in the link.</div>
</div>
<script>
(async()=>{
 const $=s=>document.querySelector(s);
 const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
 const b64u=s=>s.replace(/-/g,"+").replace(/_/g,"/");
 async function gunzip(bytes){
   if(!("DecompressionStream"in window))return null;
   const ds=new DecompressionStream("gzip");
   const stream=new Blob([bytes]).stream().pipeThrough(ds);
   const buf=await new Response(stream).arrayBuffer();
   return new Uint8Array(buf);
 }
 async function fetchRemote(id){
   const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),10000);
   try{
     const res=await fetch("https://pastebin.ai/api/v1/pastes/"+encodeURIComponent(id),{signal:controller.signal,cache:"no-store"});
     if(!res.ok)throw new Error("HTTP "+res.status);
     const body=await res.json();
     const content=typeof body?.content==="string"?body.content:(typeof body==="string"?body:"");
     if(!content)throw new Error("No share data");
     return JSON.parse(content);
   }finally{clearTimeout(timer)}
 }
 async function decode(){
   const raw=decodeURIComponent(location.hash.slice(1)||"");
   if(!raw)return null;
   if(/^[A-Za-z0-9_-]{6,40}$/.test(raw)){
     try{return await fetchRemote(raw)}catch(e){console.warn("Remote Localify share could not be loaded",e)}
   }
   try{
     const pad="=".repeat((4-raw.length%4)%4),bin=atob(b64u(raw)+pad);
     const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
     if(bytes[0]===31&&bytes[1]===139){
       const out=await gunzip(bytes);if(!out)return null;
       return JSON.parse(new TextDecoder().decode(out));
     }
     return JSON.parse(new TextDecoder().decode(bytes));
   }catch{return null}
 }
 function setMeta(sel,value){const el=document.querySelector(sel);if(el)el.setAttribute("content",value)}
 const d=await decode();
 if(!d){
   $("#subtitle").textContent="This share link is missing, expired, or invalid.";
   $("#list").innerHTML='<div class="empty">Create a new share preview from Localify.</div>';
   setMeta('meta[property="og:title"]',"Localify Share");
   setMeta('meta[property="og:description"]',"Open this Localify share link to preview a shared library.");
   return;
 }
 const cats={
  overview:{label:"Overview",items:[]},
  albums:{label:"Albums",items:Array.isArray(d.a)?d.a:(d.albums||[])},
  artists:{label:"Artists",items:Array.isArray(d.r)?d.r:(d.artists||[])},
  songs:{label:"Songs",items:Array.isArray(d.s)?d.s:(d.songs||[])},
  folders:{label:"Folders",items:Array.isArray(d.f)?d.f:(d.folders||[])},
  playlists:{label:"Playlists",items:Array.isArray(d.p)?d.p:(d.playlists||[])}
 };
 const counts=d.c||d.counts||{};
 const title=String(d.n||d.name||"Localify Library");
 const songCount=Number(counts.songs??d.totalTracks??cats.songs.items.length);
 const albumCount=Number(counts.albums??cats.albums.items.length);
 const artistCount=Number(counts.artists??cats.artists.items.length);
 const folderCount=Number(counts.folders??cats.folders.items.length);
 $("#title").textContent=title;
 $("#subtitle").textContent="Shared Localify library • "+songCount.toLocaleString()+" songs";
 const stats=[["Albums",albumCount],["Artists",artistCount],["Songs",songCount],["Folders",folderCount]];
 $("#stats").innerHTML=stats.map(x=>'<div class="stat"><b>'+Number(x[1]||0).toLocaleString()+'</b><span>'+x[0]+'</span></div>').join("");
 const allCovers=[];
 for(const x of cats.albums.items)if(x.k||x.cover)allCovers.push(x.k||x.cover);
 $("#coverWall").innerHTML=allCovers.slice(0,4).map(u=>'<div class="coverCell"><img src="'+esc(u)+'" alt=""></div>').join("");
 while($("#coverWall").children.length<4)$("#coverWall").insertAdjacentHTML("beforeend",'<div class="coverCell">♫</div>');
 let current="overview",query="";
 function itemData(id){
   if(id==="overview")return [
     ...cats.albums.items.slice(0,8).map(x=>({type:"Album",name:(x.t??x.title)||"Untitled album",sub:(x.a??x.artist)||"Unknown Artist",cover:(x.k??x.cover)||"",badge:x.y||x.year||""})),
     ...cats.artists.items.slice(0,8).map(x=>({type:"Artist",name:(x.n??x.name)||"Unknown Artist",sub:x.g??"Artist",cover:(x.k??x.cover)||""})),
     ...cats.songs.items.slice(0,8).map(x=>({type:"Song",name:(x.t??x.title)||"Untitled song",sub:(x.a??x.artist)||"Unknown Artist",cover:(x.k??x.cover)||"",badge:x.n||x.trackNumber||""})),
     ...cats.folders.items.slice(0,8).map(x=>({type:"Folder",name:(x.n??x.name)||"Untitled folder",sub:(x.i??x.extra??"0")+" items"})),
     ...cats.playlists.items.slice(0,8).map(x=>({type:"Playlist",name:(x.n??x.name)||"Untitled playlist",sub:(x.i??x.extra??"0")+" songs"}))
   ];
   if(id==="albums")return cats.albums.items.map(x=>({type:"Album",name:(x.t??x.title)||"Untitled album",sub:(x.a??x.artist)||"Unknown Artist",cover:(x.k??x.cover)||"",badge:x.y||x.year||""}));
   if(id==="artists")return cats.artists.items.map(x=>({type:"Artist",name:(x.n??x.name)||"Unknown Artist",sub:x.g??"Artist",cover:(x.k??x.cover)||""}));
   if(id==="songs")return cats.songs.items.map(x=>({type:"Song",name:(x.t??x.title)||"Untitled song",sub:(x.a??x.artist)||"Unknown Artist",cover:(x.k??x.cover)||"",badge:x.n||x.trackNumber||""}));
   if(id==="folders")return cats.folders.items.map(x=>({type:"Folder",name:(x.n??x.name)||"Untitled folder",sub:(x.i??x.extra??"0")+" items"}));
   return cats.playlists.items.map(x=>({type:"Playlist",name:(x.n??x.name)||"Untitled playlist",sub:(x.i??x.extra??"0")+" songs"}));
 }
 function render(){
   const q=query.trim().toLocaleLowerCase(),items=itemData(current).filter(x=>!q||(x.name+" "+x.sub).toLocaleLowerCase().includes(q));
   $("#count").textContent=items.length.toLocaleString()+" shown";
   $("#list").innerHTML=items.length?items.map(x=>'<div class="row"><div class="miniArt">'+(x.cover?'<img src="'+esc(x.cover)+'" alt="">':(x.type==="Folder"?"▣":x.type==="Artist"?"♟":x.type==="Playlist"?"☷":"♫"))+'</div><div><div class="name">'+esc(x.name)+'</div><div class="sub">'+esc(x.sub)+'</div></div><div class="badge">'+esc(x.badge||"")+'</div></div>').join(""):'<div class="empty">Nothing in this category matches your search.</div>';
 }
 function renderTabs(){
   $("#tabs").innerHTML=Object.entries(cats).map(([id,x])=>'<button class="tab '+(id===current?"active":"")+'" data-tab="'+id+'">'+x.label+'</button>').join("");
   document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{current=b.dataset.tab;query="";$("#search").value="";renderTabs();render()});
 }
 $("#search").oninput=e=>{query=e.target.value;render()};
 renderTabs();render();
 document.title=title+" — Localify";
 setMeta('meta[property="og:title"]',title+" — Localify");
 setMeta('meta[property="og:description"]',albumCount.toLocaleString()+" albums • "+artistCount.toLocaleString()+" artists • "+songCount.toLocaleString()+" songs • "+folderCount.toLocaleString()+" folders");
 setMeta('meta[name="twitter:title"]',title+" — Localify");
 setMeta('meta[name="twitter:description"]',albumCount.toLocaleString()+" albums • "+artistCount.toLocaleString()+" artists • "+songCount.toLocaleString()+" songs • "+folderCount.toLocaleString()+" folders");
})();
</script>
</body>
</html>
